apply plugin: 'com.android.library'

// :libygoengine —— 薄 JNI 决斗引擎（libygoengine.so）打包模块。
// 仿 :libcore 约定：native 产物由 engine/jni 下 ndk-build 生成到 engine/libs/<abi>/，
// 本模块仅通过 jniLibs 打包这些 .so，并对外提供一个可选的构建 task。
android {
    compileSdkVersion rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdkVersion 21
        //noinspection ExpiredTargetSdkVersion
        targetSdkVersion 29
        ndkVersion "29.0.14206865"
    }

    sourceSets {
        main {
            // engine/libs/<abi>/libygoengine.so 由 buildYgoEngine 任务或手动 ndk-build 产出
            jniLibs.srcDirs = ['../engine/libs']
        }
    }

    namespace 'cn.garymb.ygomobile.enginebridge'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}

def ndkBuildCmd = org.gradle.internal.os.OperatingSystem.current().windows ? "ndk-build.cmd" : "ndk-build"
def engineDir = new File(projectDir, "../engine")

// 编译薄引擎: 在 engine 目录执行 ndk-build，产物输出到 engine/libs/<abi>/libygoengine.so
// 使用: ./gradlew :libygoengine:buildYgoEngine
task buildYgoEngine(type: Exec) {
    group = 'ygo'
    description = '使用 ndk-build 编译 libygoengine.so'
    workingDir engineDir
    commandLine "${android.ndkDirectory}/${ndkBuildCmd}",
            "-C", engineDir.absolutePath,
            "NDK_OUT=${new File(engineDir, 'obj').absolutePath}",
            "NDK_LIBS_OUT=${new File(engineDir, 'libs').absolutePath}",
            '-j4'
}

// 清理薄引擎构建产物
task cleanYgoEngine(type: Exec) {
    group = 'ygo'
    description = '清理 libygoengine.so 的 ndk-build 产物 (engine/obj 与 engine/libs)'
    workingDir engineDir
    commandLine "${android.ndkDirectory}/${ndkBuildCmd}",
            "-C", engineDir.absolutePath,
            "NDK_OUT=${new File(engineDir, 'obj').absolutePath}",
            "NDK_LIBS_OUT=${new File(engineDir, 'libs').absolutePath}",
            'clean'
}
