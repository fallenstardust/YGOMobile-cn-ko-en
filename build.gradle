// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        // 显式命名仓库，否则 Gradle 只报 “Repository MavenRepo”，无法定位是哪个镜像出错
        maven { name = 'aliyun-public'; url = 'https://maven.aliyun.com/repository/public/' }
        maven { name = 'aliyun-gradle-plugin'; url = 'https://maven.aliyun.com/repository/gradle-plugin/' }
        maven { name = 'aliyun-google'; url = 'https://maven.aliyun.com/repository/google/' }
        maven { name = 'aliyun-jcenter'; url = 'https://maven.aliyun.com/repository/jcenter/' }
        maven { name = 'aliyun-central'; url = 'https://maven.aliyun.com/repository/central/' }
        maven { name = 'maven-central-direct'; url = 'https://repo1.maven.org/maven2/' }
        mavenCentral()
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.6.0'
        classpath 'com.android.tools.build:gradle-experimental:0.11.1'
        //classpath 'me.tatarka:gradle-retrolambda:3.2.5'
    }
}

ext {
    compileSdkVersion = 35
    //buildToolsVersion = compileSdkVersion+".0.0"
    supportVersion = "30.0.0"
}

allprojects {
    repositories {
        maven { name = 'aliyun-public'; url = 'https://maven.aliyun.com/repository/public/' }
        maven { name = 'aliyun-gradle-plugin'; url = 'https://maven.aliyun.com/repository/gradle-plugin/' }
        maven { name = 'aliyun-google'; url = 'https://maven.aliyun.com/repository/google/' }
        maven { name = 'aliyun-jcenter'; url = 'https://maven.aliyun.com/repository/jcenter/' }
        maven { name = 'aliyun-central'; url = 'https://maven.aliyun.com/repository/central/' }
        maven { name = 'maven-central-direct'; url = 'https://repo1.maven.org/maven2/' }
        mavenCentral()
        //smack
        maven {
            name = 'sonatype-snapshots'
            url = 'https://oss.sonatype.org/content/repositories/snapshots'
        }
        google()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
