name: build YGOMobile

on:
  push:
    tags:
      - '*.*.*'
    
jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Setup Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        accept-android-sdk-licenses: true

    - name: Install Android packages
      run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.14206865"

    - name: Set Android Environment
      run: |
        echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
        echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> $GITHUB_ENV
        echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> $GITHUB_ENV
        echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
        echo "$ANDROID_SDK_ROOT/build-tools/35.0.0" >> $GITHUB_PATH

    - name: Use CI Gradle repositories
      run: |
        cp .github/ci/build.gradle build.gradle

    - name: Git Config
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "github-actions@github.com"

    - name: Set SSH Key
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      run: |
        mkdir -p ~/.ssh
        echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519

    - name: Prepare
      run: |
        git clone ${{ secrets.PICS_REPO }} --depth 1 pics
        git clone https://github.com/Smile-DK/ygopro-scripts.git --depth 1 script
        cd pics
        rm -r .git
        cd ../script
        rm -r .git
        cd ..
        zip -r pics.zip pics
        zip -r scripts.zip script
        mv *.zip mobile/assets/data/

    - name: Prepare DB
      run: |
        git clone https://github.com/mycard/ygopro-database.git --depth 1 ygopro-database
        cp ygopro-database/locales/zh-CN/cards.cdb mobile/assets/data/cards.cdb
        cp ygopro-database/locales/pt-PT/cards.cdb mobile/assets/pt/data/cards.cdb
        cp ygopro-database/locales/ko-KR/cards.cdb mobile/assets/kor/data/cards.cdb
        cp ygopro-database/locales/ja-JP/cards.cdb mobile/assets/jp/data/cards.cdb
        cp ygopro-database/locales/es-ES/cards.cdb mobile/assets/es/data/cards.cdb
        cp ygopro-database/locales/en-US/cards.cdb mobile/assets/en/data/cards.cdb

    - name: Prepare Sound
      run: |
        cd mobile/assets/en/data
        wget https://github.com/fallenstardust/YGOMobile-cn-ko-en/releases/download/sounds/sound.fonts.zip
        unzip sound.fonts.zip
        rm sound.fonts.zip

    - name: Prepare Pack
      run: |
        git clone https://github.com/fallenstardust/ygopro-card-list.git --depth 1 ygopro-card-list
        mv ygopro-card-list/pack mobile/assets/data/

    - name: Prepare libWindbot.aar
      run: |
        cd mobile/libs
        wget https://github.com/mercury233/libWindbot/releases/download/latest/libWindbot.aar

    - name: Build
      run: |
        chmod +x gradlew
        ./gradlew --no-configuration-cache assembleCnRelease
      env:
        GRADLE_OPTS: -Dorg.gradle.jvmargs="-Dhttp.proxyHost= -Dhttps.proxyHost="

    - name: Decode Keystore File
      run: |
        git clone ${{ secrets.KEYSTORE_REPO }} --depth 1 jks
        mv jks/ygomobile.jks ./ygomobile.jks

    - name: Sign apk
      run: |
        mkdir build
        apksigner sign --ks ./ygomobile.jks --ks-key-alias ${{ secrets.KEY_ALIAS }} --key-pass pass:${{ secrets.KEYSTORE_PASSWORD }} --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} --out ./build/YGOMobile.apk ./mobile/build/outputs/apk/cn/release/*.Apk

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: YGOMobile.apk
        retention-days: 1
        path: ./build/YGOMobile.apk

  create-release:
    needs: [build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: build

      - name: Create release-latest
        run: |
          cd build
          gh release delete release-latest --cleanup-tag -y || true
          gh release create release-latest $(find . -type f) \
            --target "$GITHUB_SHA" \
            --title "release-latest" \
            --notes "Latest build for ${{ github.ref_name }}" \
            --latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-s3:
    needs: [build-android]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: build

      - name: proxy
        uses: jwyxym/jwyxym/shadowsocks@master
        with:
          ss_server: ${{ secrets.SS_SERVER }}
          ss_server_port: ${{ secrets.SS_SERVER_PORT }}
          ss_pass: ${{ secrets.SS_PASS }}

      - name: Upload to Bucket
        uses: jwyxym/jwyxym/s3@master
        with:
          proxy: http://127.0.0.1:1081
          s3_endpoint: ${{ secrets.S3_ENDPOINT }}
          access_key: ${{ secrets.S3_ACCESS_KEY }}
          secret_key: ${{ secrets.S3_SECRET_KEY }}
          bucket: ${{ secrets.S3_BUCKET }}
          file_name: YGOMobile.apk
          file_path: ./build/YGOMobile.apk/YGOMobile.apk

      - name: cdn
        uses: jwyxym/jwyxym/edgeone-cache@master
        with:
          proxy: http://127.0.0.1:1081
          secret_id: ${{ secrets.EDGE_ID }}
          secret_key: ${{ secrets.EDGE_KEY }}
          zone_id: ${{ secrets.EDGE_ZONE_ID }}
          url_target: ${{ secrets.EDGE_URL }}